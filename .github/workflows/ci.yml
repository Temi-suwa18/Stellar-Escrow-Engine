name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 20.11.0
  PNPM_VERSION: 9.15.0

jobs:
  lint-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Format check
        run: pnpm format:check

  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: stellar
          POSTGRES_PASSWORD: stellar
          POSTGRES_DB: stellar_escrow_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U stellar -d stellar_escrow_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://stellar:stellar@localhost:5432/stellar_escrow_test?schema=public
      REDIS_URL: redis://localhost:6379/1
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Unit tests
        run: pnpm test -- --coverage

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint-typecheck, test]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all workspaces
        run: pnpm build

  docker-build:
    name: Docker Build (Backend, Frontend)
    runs-on: ubuntu-latest
    needs: [build]
    strategy:
      matrix:
        app: [Backend, Frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.app }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.app }}/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Pushes to the ECR repos Infra/terraform/ecr.tf creates (escra/api,
  # escra/web), tagged with the commit SHA and `latest`. Only runs on main —
  # PR builds stop at docker-build (compile-check only, never pushed).
  #
  # Requires these repo variables/secrets to be configured (Settings ->
  # Secrets and variables -> Actions):
  #   vars.AWS_REGION      e.g. "us-east-1" — must match Infra/terraform's var.aws_region
  #   secrets.AWS_ROLE_ARN IAM role this workflow assumes via OIDC (no long-lived AWS keys)
  #
  # The role needs an OIDC trust policy for token.actions.githubusercontent.com
  # scoped to this repo, and ecr:GetAuthorizationToken / ecr:BatchCheckLayerAvailability
  # / ecr:PutImage / ecr:InitiateLayerUpload / ecr:UploadLayerPart / ecr:CompleteLayerUpload
  # on the two repositories — see https://github.com/aws-actions/configure-aws-credentials
  # for the trust policy shape.
  docker-push:
    name: Push images to ECR
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      id-token: write
      contents: read
    strategy:
      matrix:
        include:
          - app: Backend
            repository: escra/api
          - app: Frontend
            repository: escra/web
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push ${{ matrix.app }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.app }}/Dockerfile
          push: true
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/${{ matrix.repository }}:${{ github.sha }}
            ${{ steps.ecr-login.outputs.registry }}/${{ matrix.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
